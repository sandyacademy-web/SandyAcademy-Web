<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sandy Academy Barber</title>

<meta name="description"
content="Korean Style Specialist Barber">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{

scroll-behavior:smooth;

}

body{

font-family:'Poppins',sans-serif;

background:#111;

color:#fff;

overflow-x:hidden;

}

/* =======================
HEADER
======================= */

header{

position:fixed;

top:0;

left:0;

width:100%;

padding:18px 8%;

display:flex;

justify-content:space-between;

align-items:center;

background:rgba(0,0,0,.55);

backdrop-filter:blur(10px);

z-index:999;

}

.logo{

font-size:24px;

font-weight:700;

color:#D4AF37;

letter-spacing:2px;

}

nav a{

color:white;

text-decoration:none;

margin-left:30px;

font-weight:500;

transition:.3s;

}

nav a:hover{

color:#D4AF37;

}

/* =======================
HERO
======================= */

.hero{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

padding:30px;

background:
linear-gradient(rgba(0,0,0,.65),
rgba(0,0,0,.70)),
url("images/hero.jpg");

background-size:cover;

background-position:center;

}

.hero-content{

max-width:850px;

}

.hero h1{

font-size:72px;

font-weight:800;

line-height:1.1;

margin-bottom:20px;

}

.hero span{

color:#D4AF37;

}

.hero p{

font-size:22px;

line-height:1.8;

margin-bottom:40px;

}

.button{

display:inline-block;

padding:18px 38px;

margin:10px;

border-radius:50px;

text-decoration:none;

font-weight:bold;

transition:.35s;

}

.ig{

background:#E1306C;

color:white;

}

.wa{

background:#25D366;

color:white;

}

.button:hover{

transform:translateY(-5px);

}

section{

padding:100px 8%;

}

h2{

font-size:48px;

text-align:center;

margin-bottom:20px;

color:#D4AF37;

}

.subtitle{

text-align:center;

font-size:20px;

max-width:800px;

margin:auto;

line-height:1.8;

margin-bottom:60px;

}

</style>

</head>

<body>

<header>

<div class="logo">

SANDY ACADEMY

</div>

<nav>

<a href="#promo">Promo</a>

<a href="#gallery">Gallery</a>

<a href="#why">Mengapa Kami</a>

<a href="#booking">Booking</a>

</nav>

</header>

<section class="hero">

<div class="hero-content">

<h1>

Korean Style

<br>

<span>Specialist</span>

</h1>

<p>

Soft Opening

<br>

Gratis guntingan untuk

10 orang pertama setiap hari.

<br>

Syarat cukup Follow Instagram.

</p>

<a href="#"

class="button ig">

Follow Instagram

</a>

<a href="#"

class="button wa">

Booking WhatsApp

</a>

</div>

</section>
